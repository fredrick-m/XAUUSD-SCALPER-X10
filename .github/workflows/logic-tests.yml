name: Logic Tests

on:
  push:
    branches:
      - audit/x10-500
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install logic-test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          grep -v '^MetaTrader5' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt

      - name: Compile critical modules
        run: |
          python -m py_compile \
            start.py \
            run_system.py \
            engine/backtest.py \
            agents/backtest_runner.py \
            agents/validation_v2.py \
            agents/correlation_agent.py \
            agents/monte_carlo.py \
            agents/sensitivity_agent.py \
            agents/risk_manager.py \
            agents/signal_gatekeeper.py \
            agents/strategy_factory.py \
            agents/news_calendar.py \
            scripts/refresh_x10_metric_version.py \
            scripts/demo_preflight.py \
            scripts/demo_switch.py \
            scripts/force_test_trade.py

      - name: Run pure logic tests
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_x10_window_metrics.py \
            tests/test_execution_ordering.py \
            tests/test_metric_version_refresh.py \
            tests/test_validation_v2.py \
            tests/test_portfolio_v5_gates.py \
            tests/test_portfolio_v5_lifecycle.py \
            tests/test_risk_engine_v2.py \
            tests/test_demo_safety_gates.py
